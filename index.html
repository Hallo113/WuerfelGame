<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meine Webseite</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    background: #f0f0f0;
    overflow-x: hidden;
}

#welcome {
    margin-top: 100px;
}

button {
    padding: 10px 20px;
    font-size: 20px;
    cursor: pointer;
}

#gameContainer {
    display: none;
    margin-top: 20px;
}

canvas {
    background: white;
    border: 2px solid black;
    max-width: 95vw;
    height: auto;
    display: block;
    margin: 0 auto;
}

#touchControls {
    display: none;
    justify-content: center;
    gap: 30px;
    margin-top: 20px;
    padding-bottom: 20px;
}

#touchControls button {
    width: 120px;
    height: 80px;
    font-size: 35px;
    padding: 0;
    border: 2px solid black;
    border-radius: 15px;
    background: #ddd;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

#touchControls button:active {
    background: #aaa;
}

@media (pointer: coarse) {
    #touchControls {
        display: flex;
    }
}

@media (max-width: 500px) {
    #touchControls {
        gap: 15px;
    }

    #touchControls button {
        width: 110px;
        height: 75px;
        font-size: 32px;
    }
}
</style>
</head>

<body>

<div id="welcome">
    <h1>Willkommen auf meiner Webseite!</h1>

    <h2>🎲 Würfel Game</h2>

    <p>Hallo</p>

    <button onclick="startGame()">▶ Start</button>
</div>


<div id="gameContainer">

    <h2>Würfel Game</h2>

    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <div id="touchControls">
        <button id="leftBtn">◀</button>
        <button id="rightBtn">▶</button>
    </div>

</div>


<script>

let canvas;
let ctx;

let player;
let enemy;

let score = 0;
let running = false;

const playerSpeed = 20;

const baseWidth = 40;
const maxWidth = baseWidth * 8;

const enemyHeight = 40;
const baseSpeed = 5;


let moveLeft = false;
let moveRight = false;


function startGame() {

    document.getElementById("welcome").style.display = "none";

    document.getElementById("gameContainer").style.display = "block";

    canvas = document.getElementById("gameCanvas");

    ctx = canvas.getContext("2d");

    setupTouchControls();

    initGame();

    document.addEventListener("keydown", keyHandler);

    gameLoop();
}


function initGame() {

    score = 0;

    running = true;

    player = {
        x: 280,
        y: 350,
        width: 40,
        height: 40
    };

    enemy = {
        width: randomWidth(),
        height: enemyHeight
    };

    enemy.x = randomX(enemy.width);

    enemy.y = 0;
}



function randomWidth() {

    return Math.floor(
        Math.random() * (maxWidth - baseWidth + 1)
    ) + baseWidth;
}


function randomX(width) {

    return Math.floor(
        Math.random() * (canvas.width - width)
    );
}



function keyHandler(e) {

    if (!running) return;


    if (
        e.key === "a" ||
        e.key === "A" ||
        e.key === "ArrowLeft"
    ) {

        player.x -= playerSpeed;

    }


    if (
        e.key === "d" ||
        e.key === "D" ||
        e.key === "ArrowRight"
    ) {

        player.x += playerSpeed;

    }


    keepPlayerInside();

}



function setupTouchControls() {

    const leftBtn = document.getElementById("leftBtn");

    const rightBtn = document.getElementById("rightBtn");



    leftBtn.addEventListener("pointerdown", function(e) {

        e.preventDefault();

        moveLeft = true;

    });


    leftBtn.addEventListener("pointerup", function() {

        moveLeft = false;

    });


    leftBtn.addEventListener("pointercancel", function() {

        moveLeft = false;

    });


    leftBtn.addEventListener("pointerleave", function() {

        moveLeft = false;

    });



    rightBtn.addEventListener("pointerdown", function(e) {

        e.preventDefault();

        moveRight = true;

    });


    rightBtn.addEventListener("pointerup", function() {

        moveRight = false;

    });


    rightBtn.addEventListener("pointercancel", function() {

        moveRight = false;

    });


    rightBtn.addEventListener("pointerleave", function() {

        moveRight = false;

    });

}


function keepPlayerInside() {

    if (player.x < 0) {

        player.x = 0;

    }


    if (player.x + player.width > canvas.width) {

        player.x = canvas.width - player.width;

    }

}


function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );



    ctx.fillStyle = "blue";

    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );



    ctx.fillStyle = "red";

    ctx.fillRect(
        enemy.x,
        enemy.y,
        enemy.width,
        enemy.height
    );



    ctx.fillStyle = "black";

    ctx.font = "20px Arial";

    ctx.fillText(
        "Score: " + score,
        10,
        25
    );

}



function checkCollision() {

    return (

        player.x < enemy.x + enemy.width &&

        player.x + player.width > enemy.x &&

        player.y < enemy.y + enemy.height &&

        player.y + player.height > enemy.y

    );

}



function gameOver() {

    running = false;

    moveLeft = false;
    moveRight = false;


    ctx.fillStyle = "black";

    ctx.font = "40px Arial";

    ctx.fillText(
        "GAME OVER",
        170,
        180
    );


    ctx.font = "25px Arial";

    ctx.fillText(
        "Score: " + score,
        245,
        220
    );


    setTimeout(function() {

        if (confirm("Neustarten?")) {

            initGame();

            gameLoop();

        }

    }, 200);

}



function gameLoop() {

    if (!running) return;


    /* Touch-Bewegung */

    if (moveLeft) {

        player.x -= playerSpeed;

    }


    if (moveRight) {

        player.x += playerSpeed;

    }


    keepPlayerInside();



    const speed =
        baseSpeed +
        Math.floor(score / 3);


    enemy.y += speed;



    if (checkCollision()) {

        gameOver();

        return;

    }



    if (enemy.y > canvas.height) {

        score++;


        enemy.width = randomWidth();

        enemy.x = randomX(enemy.width);

        enemy.y = 0;

    }


    draw();


    requestAnimationFrame(gameLoop);

}

</script>

</body>
</html>
